name: Build and publish Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RPG Image Restorer ${{ github.ref_name }} – Initial Release
          body: |
            ## RPG Image Restorer ${{ github.ref_name }}

            Initial public testing release.

            ### Features
            - Restore RPG Maker `.png_` images.
            - Batch image conversion and folder selection.
            - Conversion progress tracking.
            - PNG output, ZIP export, and sharing.
            - Offline, on-device processing.

            ### Compatibility
            - `.png_` is the primary target format.
            - `.rpgmvp` is not yet verified.
            - Compatibility with all RPG Maker versions has not been established.

            This is an early testing release. Please report bugs with the error message and a sample file you are authorized to share.
          files: extracted/**/build/outputs/apk/debug/*.apk
          prerelease: true
          fail_on_unmatched_files: true
